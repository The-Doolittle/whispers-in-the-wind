<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ '/' | relative_url }}" class="brand">
      <span class="brand-mark">
        <img src="{{ '/images/WITW_Logo_Black.png' | relative_url }}" alt="Whispers in the Wind logo" width="337" height="217">
      </span>
      <span class="brand-text">Whispers in the Wind</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if item.cta %} class="nav-cta"{% endif %}{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>&copy; <span id="year"></span> Whispers in the Wind</span>
    <nav class="footer-nav">
      <a href="{{ '/about.html' | relative_url }}">About</a>
      <a href="{{ '/contact.html' | relative_url }}">Contact</a>
      <a href="{{ '/donate.html' | relative_url }}">Donate</a>
    </nav>
  </div>
</footer>

<script src="{{ '/js/script.js' | relative_url }}" defer></script>
</body>
</html>
